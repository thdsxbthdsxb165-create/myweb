<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{margin:0;background:#0f172a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#e2e8f0;}
.card{background:#1e293b;padding:30px 34px;border-radius:14px;width:min(440px,100%);box-shadow:0 20px 40px rgba(0,0,0,.45);}
h2{margin:0 0 18px;text-align:center;color:white;}
.section-title{font-size:14px;color:#94a3b8;margin-top:15px;margin-bottom:5px;}
.input-group{position:relative;}
input{width:100%;padding:12px 14px;margin:6px 0;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;}
input:focus{outline:none;border-color:#3b82f6;}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#93c5fd;font-size:13px;}
button{width:100%;padding:12px;margin-top:15px;border-radius:9px;border:none;background:#2563eb;color:white;font-weight:bold;cursor:pointer;}
button:hover{background:#3b82f6;}
.footer{text-align:center;margin-top:15px;font-size:14px;color:#cbd5e1;}
a{color:#38bdf8;text-decoration:none;}
.error{background:#dc2626;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;color:white;}
</style>
</head>
<body>
<div class="card">
    <h2>Register</h2>
    {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
    <form method="POST">
        <div class="section-title">Account</div>
        <input name="email" placeholder="Email" required>
        <div class="input-group">
            <input id="pass" name="password" type="password" placeholder="Password" required>
            <span class="eye" onclick="toggle('pass')">Show</span>
        </div>
        <div class="input-group">
            <input id="confirm" name="confirm" type="password" placeholder="Confirm password" required>
            <span class="eye" onclick="toggle('confirm')">Show</span>
        </div>
        <div class="section-title">Profile</div>
        <input name="phone" placeholder="Phone">
        <input name="name_th" placeholder="Thai full name">
        <input name="name_en" placeholder="English full name">
        <input name="contact" placeholder="Company / Facebook / Line">
        <button type="submit">Create Account</button>
    </form>
    <div class="footer">Already have an account? <a href="/login">Login</a></div>
</div>
<script>
function toggle(id){
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
